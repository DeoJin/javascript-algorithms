<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Permutation lock illustration</title>
  <desc id="desc">A simple three-digit lock showing the code 333.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="dial" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <rect width="720" height="220" rx="24" fill="url(#bg)" />
  <rect x="48" y="36" width="624" height="148" rx="24" fill="#1e293b" />
  <text x="360" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#cbd5e1">Permutation lock</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(180 112)">
      <circle r="46" fill="url(#dial)" stroke="#94a3b8" stroke-width="4" />
      <circle r="8" fill="#475569" />
      <text y="14" font-size="52" font-weight="700" fill="#0f172a">3</text>
    </g>
    <g transform="translate(360 112)">
      <circle r="46" fill="url(#dial)" stroke="#94a3b8" stroke-width="4" />
      <circle r="8" fill="#475569" />
      <text y="14" font-size="52" font-weight="700" fill="#0f172a">3</text>
    </g>
    <g transform="translate(540 112)">
      <circle r="46" fill="url(#dial)" stroke="#94a3b8" stroke-width="4" />
      <circle r="8" fill="#475569" />
      <text y="14" font-size="52" font-weight="700" fill="#0f172a">3</text>
    </g>
  </g>
</svg>
